<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>ランダム文字列ジェネレータ</title>
    <link rel="stylesheet" th:href="@{/style/random.css}">
</head>

<body>

	<h1>ランダム文字列ジェネレータ</h1>

	<!-- Error message -->
	<div th:if="${errMessage}">
		<p class="error-message" th:text="${errMessage}"></p>
	</div>

	<!-- Main form -->
	<form action="/random" method="post">

		<p>
			<!-- Character length -->
			<label>文字数：</label>
			<select name="charLength" th:value="${charLength}">
				<option th:each="i : ${#numbers.sequence(5, 10)}" th:value="${i}" th:text="${i} + '文字'">
				</option>
			</select>
		</p>

		<p>
			<!-- Checkboxes -->
			<label>
				<input type="checkbox" name="withNumber" th:checked="${withNumber}">
				数字を含める
			</label>

			<label>
				<input type="checkbox" name="withAlphabet" th:checked="${withAlphabet}">
				英字を含める
			</label>
		</p>

		<p>
			<!-- Create count -->
			<label>
				<input type="number" name="createCount" th:value="${createCount}"
					th:classappend="${errMessage} ? 'input-error' : ''">
				個生成する
			</label>
		</p>

		<p>
			<button type="submit">作成する</button>
		</p>

	</form>

	<hr>

	<!-- Results -->
	<div th:each="str : ${randList}">
		<p class="result-item" th:text="${str}"></p>
	</div>

</body>

</html>
