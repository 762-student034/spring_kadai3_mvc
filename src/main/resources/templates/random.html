<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ランダム文字列ジェネレータ</title>
</head>
<body>
	<h1>ランダム文字列ジェネレータ</h1>

	<form action="/random" method="post">
		<p>
			<select name="charLength">
				<option th:each="i : ${#numbers.sequence(5, 10)}" 
					th:value="${i}" th:text="${i}+ '文字'"></option>
			</select>
			
			<input type="checkbox" name="withNumber" th:checked="${withNumber}">数字を含める			
			<!-- <input type="checkbox" name="withNumber" value="true">数字を含める -->

			<input type="checkbox" name="withAlphabet" th:checked="${withAlphabet}">英字を含める <br>
			<!-- <input type="checkbox" name="withAlphabet" value="true">英字を含める <br> -->

			<input type="number" name="createCount" th:value="${createCount}">個生成する
			<!-- <input type="number" name="createCount">個生成する -->

		</p>
		<p>
			<button>作成する</button>
		</p>
	</form>
	<hr>
	<p th:each="str:${randList}" th:text="${str}"></p>
</body>
</html>
